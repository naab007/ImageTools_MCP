[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-tools-mcp"
version = "0.1.0"
description = "MCP server for image creation, editing, format conversion, and AI generation. MS Paint-style drawing primitives over a session canvas, plus broad format support (PNG/JPEG/WebP/HEIC/AVIF/SVG/RAW/...)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "Pillow>=10.2.0",
    "pillow-heif>=0.16.0",
    "cairosvg>=2.7.0",
    "numpy>=1.26.0",
    "pypdfium2>=4.30.0",
    "psd-tools>=1.17.0",
]

[project.optional-dependencies]
raw = [
    "rawpy>=0.21.0",
]
sd = [
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "torch>=2.2.0",
    # opencv-python for the canny ControlNet preprocessor (``canny_edges``).
    "opencv-python>=4.10",
]
qwen = [
    # diffusers 0.38+ ships QwenImageEditPlusPipeline + GGUF identity-mapping
    # checkpoint_fn for QwenImageTransformer2DModel.
    "diffusers>=0.38.0",
    # transformers 5.x changed Qwen2-VL state-dict layout (added a
    # ``language_model`` intermediate level) and segfaults loading the
    # saved 2511 checkpoint shards on Windows via the new parallel
    # weight materializer.
    "transformers>=4.45.0,<5.0",
    "accelerate>=0.30.0",
    "torch>=2.2.0",
    # safetensors 0.8 RC has a Windows storage-slice access-violation bug
    # under load; pin to the stable 0.7.x series.
    "safetensors>=0.4.0,<0.8",
    "peft>=0.11.0",
    # 4-bit text encoder so the Q4 transformer + Qwen2.5-VL fit in 24 GB VRAM.
    "bitsandbytes>=0.43.0",
    # GGUF-quantized transformer (Q4_K_M etc.) — used when ``gguf_path=`` is
    # supplied to qwen_load.
    "gguf>=0.10.0",
]
sam = [
    "sam2>=1.1.0",
    "torch>=2.2.0",
    "huggingface_hub>=0.24.0",
]
seg = [
    # Promptable / one-shot / text-prompted segmentation models behind
    # ``yolo_*``, ``sam1_*``, ``birefnet_*``, ``clipseg_*`` tools.
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.45.0",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "huggingface_hub>=0.24.0",
    # OpenCV — used by the canny ControlNet preprocessor and by
    # ``mask_ops`` guided-filter matte feathering. opencv-contrib-python
    # is needed for ``cv2.ximgproc`` (matte mode); the regular package is
    # fine for canny.
    "opencv-python>=4.10",
]
yolo = [
    "ultralytics>=8.4.0",
    "torch>=2.2.0",
]
face = [
    # Slim face swap + face restoration (ReActor-style without the
    # NSFW/gender/multi-model surface). InsightFace ``buffalo_l`` detector +
    # ``inswapper_128.onnx`` swapper + GFPGAN restorer.
    "insightface>=0.7.3,<0.8",
    "onnxruntime>=1.18",          # CPU; replace with onnxruntime-gpu for CUDA inference
    "opencv-python>=4.10",
    "gfpgan>=1.3.8",
    "numpy>=1.24,<3",
]
gguf = [
    # GGUF-quantized diffusion model loading. Plug into `qwen_load` / `sd_load`
    # via gguf_path. Best supported for Qwen-Image-Edit, FLUX, and SD3.
    # See the [qwen] notes for why the upper bounds on transformers and
    # safetensors are tight.
    "diffusers>=0.38.0",
    "gguf>=0.10.0",
    "transformers>=4.45.0,<5.0",
    "torch>=2.2.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0,<0.8",
    "huggingface_hub>=0.24.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
image-tools-mcp-server = "server.image_tools_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
